name: Deploy to Render

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: safespace_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: |
        npm ci
        cd backend && npm ci
    
    - name: Generate Prisma Client
      run: cd backend && npx prisma generate
    
    - name: Run database migrations
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/safespace_test
      run: cd backend && npx prisma migrate deploy
    
    - name: Run type check
      run: cd backend && npm run typecheck
    
    - name: Run tests (if available)
      run: cd backend && npm test || echo "No tests configured"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - name: Deploy to Render
      env:
        RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
          curl "$RENDER_DEPLOY_HOOK_URL"
          echo "Deploy triggered on Render"
        else
          echo "RENDER_DEPLOY_HOOK_URL not set - skipping deploy trigger"
          echo "To enable automatic deploys, add the deploy hook URL to GitHub secrets"
        fi
