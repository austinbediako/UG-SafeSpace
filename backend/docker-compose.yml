name: ug-safespace

services:
  # ─── Backend API Server ─────────────────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: safespace-backend
    ports:
      - "3105:3105"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace_ug?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: dab44fce5901d821a5b7f6d7f03a4473b04d2d3ac34590394ba92b16f739bd46
      JWT_REFRESH_SECRET: 9b63119e049409e51ce99c2c504cff736d2f6c2503c1917b96d2db62f6b669a7
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      PORT: 3105
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:3100,http://localhost:3101,http://localhost:3102,http://localhost:3103,http://localhost:3104

      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: noreply@safespace.ug.edu.gh
      AUTH_APP_URL: http://localhost:3104
      REPORTING_PORTAL_URL: http://localhost:3101
      PARTICIPATION_PORTAL_URL: http://localhost:3100
      COMMITTEE_DASHBOARD_URL: http://localhost:3102
      PUBLIC_PLATFORM_URL: http://localhost:3103
    volumes:
      - ../packages:/app/packages
      - ./src:/app/backend/src
      - ./prisma:/app/backend/prisma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

  # ─── Database Migration + Seed (one-shot) ──────────────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: safespace-migrate
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/safespace_ug?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        cd /app/backend &&
        npx prisma migrate deploy &&
        npx tsx --env-file=.env prisma/seed.ts
      "
    volumes:
      - ./prisma:/app/backend/prisma
    profiles:
      - migrate

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: safespace-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: safespace_ug
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: safespace-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5



  # ─── MailHog (Email testing) ────────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: safespace-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
  redisdata:

