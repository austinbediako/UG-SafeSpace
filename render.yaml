  #   envVars:
  #     - key: NEXT_PUBLIC_API_URL
  #       value: https://safespace-ug-backend.onrender.com/api/v1

databases:
  - name: safespace-ug-db
    plan: standard
    region: oregon
    ipAllowList: []

redis:
  - name: safespace-ug-redis
    plan: standard
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
