# Render Blueprint for SafeSpace UG
# This file configures all services for one-click deployment

services:
  # Backend API Service
  - type: web
    name: safespace-ug-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: |
      npm install -g pnpm@9 && \
      pnpm install && \
      cd backend && \
      npx prisma generate && \
      pnpm run build && \
      chmod +x render-entrypoint.sh
    startCommand: cd backend && npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: safespace-ug-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: safespace-ug-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com  # Update with your SMTP provider
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Set manually
      - key: SMTP_PASS
        sync: false  # Set manually
      - key: SMTP_FROM
        value: noreply@safespace-ug.com
      - key: CORS_ORIGINS
        value: https://ug-safe-space-ug-spacespace-auth-ap.vercel.app,https://ug-safe-space-committee-dashboard.vercel.app,https://ug-safe-space-public-awareness-plat.vercel.app,https://ug-safe-space-reporting-portal.vercel.app,https://ug-safe-space-participation-portal.vercel.app
      - key: AUTH_APP_URL
        value: https://ug-safe-space-ug-spacespace-auth-ap.vercel.app
      - key: REPORTING_PORTAL_URL
        value: https://ug-safe-space-reporting-portal.vercel.app
      - key: PARTICIPATION_PORTAL_URL
        value: https://ug-safe-space-participation-portal.vercel.app
      - key: COMMITTEE_DASHBOARD_URL
        value: https://ug-safe-space-committee-dashboard.vercel.app
      - key: PUBLIC_PLATFORM_URL
        value: https://ug-safe-space-public-awareness-plat.vercel.app
      - key: LOG_LEVEL
        value: info

  # Optional: Frontend apps as static sites or separate web services
  # Uncomment if you want to host frontends on Render too

