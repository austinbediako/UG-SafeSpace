# Render Blueprint for SafeSpace UG
# This file configures all services for one-click deployment

services:
  # Backend API Service
  - type: web
    name: safespace-ug-backend
    runtime: node
    plan: standard
    region: oregon
    buildCommand: |
      cd backend && \
      npm install && \
      npx prisma generate && \
      npm run build && \
      chmod +x render-entrypoint.sh
    startCommand: cd backend && npm run start:render
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: safespace-ug-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safespace-ug-redis
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: STORAGE_ENDPOINT
        value: https://storage.googleapis.com  # Update with your S3/MinIO endpoint
      - key: STORAGE_BUCKET
        value: safespace-ug-evidence
      - key: STORAGE_ACCESS_KEY
        sync: false  # Set manually in Render dashboard
      - key: STORAGE_SECRET_KEY
        sync: false  # Set manually in Render dashboard
      - key: SMTP_HOST
        value: smtp.gmail.com  # Update with your SMTP provider
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false  # Set manually
      - key: SMTP_PASS
        sync: false  # Set manually
      - key: SMTP_FROM
        value: noreply@safespace-ug.com
      - key: CORS_ORIGINS
        value: https://safespace-ug-auth.onrender.com,https://safespace-ug-dashboard.onrender.com,https://safespace-ug-portal.onrender.com
      - key: AUTH_APP_URL
        value: https://safespace-ug-auth.onrender.com
      - key: REPORTING_PORTAL_URL
        value: https://safespace-ug-reporting.onrender.com
      - key: PARTICIPATION_PORTAL_URL
        value: https://safespace-ug-portal.onrender.com
      - key: COMMITTEE_DASHBOARD_URL
        value: https://safespace-ug-dashboard.onrender.com
      - key: PUBLIC_PLATFORM_URL
        value: https://safespace-ug.onrender.com
      - key: LOG_LEVEL
        value: info

  # Optional: Frontend apps as static sites or separate web services
  # Uncomment if you want to host frontends on Render too

