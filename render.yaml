  # - type: web
  #   name: safespace-ug-dashboard
  #   runtime: node
  #   plan: starter
  #   buildCommand: cd apps/committee-dashboard && npm install && npm run build
  #   startCommand: cd apps/committee-dashboard && npm start
  #   envVars:
  #     - key: NEXT_PUBLIC_API_URL
  #       value: https://safespace-ug-backend.onrender.com/api/v1

  # - type: web
  #   name: safespace-ug-portal
  #   runtime: node
  #   plan: starter
  #   buildCommand: cd apps/participation-portal && npm install && npm run build
  #   startCommand: cd apps/participation-portal && npm start
  #   envVars:
  #     - key: NEXT_PUBLIC_API_URL
  #       value: https://safespace-ug-backend.onrender.com/api/v1

  - type: keyvalue
    name: safespace-ug-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: safespace-ug-db
    plan: free
    region: oregon
    ipAllowList: []
